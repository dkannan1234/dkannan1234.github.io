<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume | Deepika Kannan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>

    .resume-page-header {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 2.5rem 2rem 1.5rem;
    }

    .resume-page-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .resume-page-header h1 em {
      font-style: italic;
      color: var(--pink-deep);
    }

    .resume-page-header p {
      font-size: 0.88rem;
      color: var(--brown-light);
      margin-bottom: 0;
    }

    /* ── action buttons row ── */
    .resume-actions {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0 2rem 1.8rem;
    }

    /* ── PDF frame ── */
    .resume-viewer-wrap {
      position: relative;
      z-index: 5;
      max-width: 860px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
    }

    .resume-viewer {
      width: 100%;
      height: 80vh;
      min-height: 520px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--beige-mid);
      box-shadow: 0 10px 40px rgba(122,92,79,0.1);
      background: var(--white);
    }

    .resume-viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* fallback message shown if iframe can't load */
    .resume-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }

    .resume-fallback .fallback-icon {
      font-size: 3rem;
      opacity: 0.5;
    }

    .resume-fallback p {
      font-size: 0.9rem;
      color: var(--brown-light);
    }

    /* ── decorative corner flourish on the frame ── */
    .resume-viewer-wrap::before {
      content: '✦';
      position: absolute;
      top: -0.8rem;
      right: 2.8rem;
      font-size: 1rem;
      color: var(--pink);
      opacity: 0.7;
      animation: float 4s ease-in-out infinite;
    }

    .resume-viewer-wrap::after {
      content: '♡';
      position: absolute;
      bottom: 3.5rem;
      left: 2.4rem;
      font-size: 0.9rem;
      color: var(--pink);
      opacity: 0.6;
      animation: float 5s 1s ease-in-out infinite;
    }

    @media (max-width: 480px) {
      .resume-viewer-wrap { padding: 0 1rem; }
      .resume-viewer { height: 65vh; border-radius: 14px; }
    }

  </style>
</head>
<body>

  <span class="sparkle">✦</span>
  <span class="sparkle">♡</span>
  <span class="sparkle">✿</span>
  <span class="sparkle">✦</span>
  <span class="sparkle">❋</span>
  <span class="sparkle">♡</span>
  <span class="sparkle">✦</span>
  <span class="sparkle">✿</span>

  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="work.html">Work</a>
      <a href="resume.html" class="active">Resume</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="resume-page-header">
    <h1>my <em>resume.</em></h1>
    <p>updated for 2026 · feel free to download</p>
    <div class="divider-dots" style="margin-top:1rem;">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="resume-actions">
    <!-- ↓ update href to your actual PDF path -->
    <a href="assets/deepika-kannan-resume.pdf" download class="btn btn-primary">
      ↓ download pdf
    </a>
    <a href="assets/deepika-kannan-resume.pdf" target="_blank" rel="noopener" class="btn btn-ghost">
      ↗ open in new tab
    </a>
  </div>

  <div class="resume-viewer-wrap">
    <div class="resume-viewer" id="resume-viewer">
      <!-- ↓ update src to your actual PDF path -->
      <iframe
        src="assets/deepika-kannan-resume.pdf"
        title="Deepika Kannan Resume"
        id="resume-iframe"
      ></iframe>

      <!-- shown if PDF can't render (e.g. mobile) -->
      <div class="resume-fallback" id="resume-fallback">
        <span class="fallback-icon">📄</span>
        <p>Your browser can't preview PDFs inline.<br>Use the buttons above to download or open it.</p>
        <a href="assets/deepika-kannan-resume.pdf" download class="btn btn-primary">↓ download resume</a>
        
        
      </div>
    </div>
  </div>

  <footer>
    <p>© <span id="year"></span> deepika kannan &nbsp;✦&nbsp; made with ♡</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Show fallback if the iframe fails to load (common on mobile Safari)
    const iframe = document.getElementById("resume-iframe");
    const fallback = document.getElementById("resume-fallback");

    iframe.addEventListener("error", () => {
      iframe.style.display = "none";
      fallback.style.display = "flex";
    });

    // On mobile, PDFs in iframes are unreliable — show fallback proactively
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      iframe.style.display = "none";
      fallback.style.display = "flex";
    }
  </script>
</body>
</html>
